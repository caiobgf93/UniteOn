services:
  postgres:
    image: postgres:16-alpine
    container_name: uniteon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uniteon
      POSTGRES_PASSWORD: uniteon
      POSTGRES_DB: uniteon
    ports:
      - "5432:5432"
    volumes:
      - uniteon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniteon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uniteon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - uniteon-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  uniteon-pgdata:
  uniteon-redisdata:
